'“We mogen met niets meer lachen”, hoor je soms na kritiek op een grap. Anderen vinden juist dat humor altijd moet kunnen. Beide uitspraken maken een ingewikkeld onderwerp erg eenvoudig. Om een grap te begrijpen en te beoordelen, moet je ook de omstandigheden bekijken waarin ze wordt gemaakt.',

{name:'Onder vrienden',text:'Je beste vriend zegt het zachtjes na jullie gezamenlijke mislukte presentatie. Jullie grappen vaak over jullie eigen podiumangst. Hij helpt je daarna om opnieuw te oefenen.',question:{id:'c0a',prompt:'Welke interpretatie wordt het best ondersteund?',options:['Een letterlijke voorspelling van een internationale tournee.','Een milde ironische poging om een gedeelde mislukking te relativeren.','Een bewijs dat vrienden nooit kunnen kwetsen.'],correct:1,why:'De vertrouwde relatie, gedeelde ervaring en steun achteraf ondersteunen een relativerende lezing. De ontvanger kan het toch pijnlijk vinden.',clue:'Relatie + gedeelde situatie + gedrag na de grap.'}},
{name:'Voor de hele klas',text:'Een klasgenoot die je vaker belachelijk maakt, zegt het luid en minachtend. Je vroeg eerder om daarmee te stoppen. Een paar leerlingen lachen; jij trekt je terug.',question:{id:'c0b',prompt:'Wat weegt hier het zwaarst in je interpretatie?',options:['Het woord “wereldtournee” heeft overal dezelfde gevoelswaarde.','Als anderen lachen, is de opmerking geslaagd voor iedereen.','De herhaalde vernedering, minachtende toon en je eerdere grens wijzen op bijtende spot.'],correct:2,why:'De voorgeschiedenis en genegeerde grens maken een sarcastische en kwetsende lezing sterk. Alleen “het was een grap” verklaart dit niet weg.',clue:'Voorgeschiedenis + publiek + reactie.'}}
],model:'Onder vrienden maken de gedeelde mislukking en de steun achteraf milde ironie aannemelijk. In de klas wijzen de herhaling en genegeerde grens op vernederende spot. Dezelfde woorden hebben daardoor een ander mogelijk effect.'},
{id:'goed',title:'Een compliment op reis',quote:'“Goed bezig!”',variants:[
{name:'De volledige scène',text:'De trainer ziet dat je opnieuw je drinkbus vergeet. Met een overdreven plechtige buiging zegt ze: “Goed bezig!” Jullie lachen en ze leent je een reservefles.',question:{id:'c1a',prompt:'Wat ondersteunt hier een ironische lezing?',options:['De positieve woorden botsen met de vergeetachtigheid; gebaar en situatie helpen de interpretatie.','De woorden zijn altijd sarcastisch.','Een trainer kan nooit een letterlijk compliment geven.'],correct:0,why:'De tegenstelling tussen lof en vergeetachtigheid draagt de ironie. De overdreven buiging levert extra informatie over de toon.',clue:'Letterlijke boodschap tegenover de zichtbare gebeurtenis.'}},
{name:'Alleen de screenshot',text:'Iemand stuurt je een screenshot met uitsluitend de woorden “Goed bezig!” Je weet niet waarop wordt gereageerd of wie het gesprek voert.',question:{id:'c1b',prompt:'Wat is de zorgvuldigste conclusie?',options:['Het is zeker sarcasme.','Er is onvoldoende context om te kiezen tussen een oprecht compliment en spot.','Het is zeker een oprecht compliment.'],correct:1,why:'Zonder aanleiding, relatie of toon zijn meerdere lezingen mogelijk. Je kunt eerst naar de ontbrekende context vragen.',clue:'Ontbrekende informatie is zelf een belangrijke vaststelling.'}}
],model:'In de scène botst het compliment met het vergeten van de drinkbus en zie ik een overdreven gebaar. De screenshot verliest die aanwijzingen. Daarom kan ik daar niet met zekerheid dezelfde interpretatie geven.'},
{id:'berg',title:'Lachen in een benarde situatie',quote:'“Een vakantie zonder haast. Precies wat ik besteld had.”',variants:[
{name:'De wandelaar zelf',text:'Een wandelaar zit door noodweer vast in een bergschuilplaats. Er is hulp onderweg, maar het wachten is angstig. Hij maakt deze opmerking tegen zijn tochtgenoot.',question:{id:'c2a',prompt:'Welk begrip past hier het meest specifiek?',options:['Parodie: hij bootst aantoonbaar een bekend werk na.','Karakterhumor: er is zeker een vaste karaktertrek bekend.','Galgenhumor: hij maakt een wrange grap over zijn eigen benarde situatie.'],correct:2,why:'De spreker zit zelf in de moeilijke situatie. De ironische formulering kan helpen om de spanning hanteerbaar te maken.',clue:'Eigen positie + angstige omstandigheden.'}},
{name:'Een buitenstaander',text:'Een onbekende plaatst dezelfde zin onder een nieuwsbericht over de gestrande wandelaar. Zijn familie leest mee en is erg ongerust.',question:{id:'c2b',prompt:'Wat verandert vooral?',options:['De spreker deelt de benarde positie niet; de grap kan voor betrokkenen afstandelijk of kwetsend overkomen.','De grap wordt automatisch een parodie.','De familie moet de humor op dezelfde manier begrijpen.'],correct:0,why:'De relatie tot de gebeurtenis en het publiek veranderen. De typering galgenhumor wordt minder vanzelfsprekend; zwarte humor of ironische spot kan verdedigbaar zijn, afhankelijk van verdere context.',clue:'Spreker + betrokkenheid van het publiek + timing.'}}
],model:'De wandelaar kan de grap gebruiken om met zijn eigen angst om te gaan. Bij de buitenstaander ontbreken die gedeelde ervaring en vertrouwdheid; de ongeruste familie kan de woorden als onverschillig ervaren.'},
{id:'reclame',title:'Wie of wat is het mikpunt?',quote:'“Onze duurzame toekomst begint met een nieuw logo.”',variants:[
{name:'Een kritische parodie',text:'Een schoolvideo bootst een bedrijfscommercial na. Terwijl de stem duurzaamheid belooft, toont het beeld stapels wegwerpverpakkingen. De makers willen loze groene beloften bekritiseren.',question:{id:'c3a',prompt:'Welke combinatie verklaart de video het best?',options:['Alleen situatiehumor, want er zijn beelden.','Parodie door de nagebootste reclamevorm, satire door kritiek op loze duurzaamheidsclaims.','Cynisme, omdat elke kritiek op een bedrijf wantrouwen tegenover alle mensen is.'],correct:1,why:'De vorm wordt komisch nagebootst en het verschil tussen belofte en gedrag wordt bekritiseerd. Parodie en satire vullen elkaar hier aan.',clue:'Herkenbare stijl + concreet mikpunt van de kritiek.'}},
{name:'Het losse fragment',text:'Alleen het mooie logo en de zin worden gedeeld via een bedrijfsaccount. Het beeld van de afvalberg en de vermelding “parodie” zijn weggeknipt.',question:{id:'c3b',prompt:'Welk risico ontstaat door deze bewerking?',options:['De boodschap blijft voor iedereen precies dezelfde.','Een logo kan nooit invloed hebben op interpretatie.','De kritische tegenstelling verdwijnt, waardoor de uiting als gewone reclame kan worden gelezen.'],correct:2,why:'Het weglaten van beeld en context kan de satirische bedoeling onzichtbaar maken. Het medium en de afzender sturen de nieuwe lezing mee.',clue:'Selectie van beelden + afzender + ontbrekende context.'}}
],model:'In de volledige video maakt de afvalberg de tegenstelling tussen belofte en gedrag zichtbaar. In het losse fragment ontbreken zowel die beelden als het label parodie. Dezelfde zin kan daardoor als een echte reclamebelofte worden gelezen.'}
];
const QUIZ=[
{id:'x0',category:'Begrippen',prompt:'Een sketch bootst een detective na, compleet met dramatische muziek, om een verdwenen koekje op te sporen. Wat staat centraal?',options:['Cynisme','Parodie','Galgenhumor','Sarcasme'],correct:1,why:'De herkenbare stijl van een detective wordt komisch nagebootst.'},
{id:'x1',category:'Begrippen',prompt:'Welke uitspraak beschrijft cynisme het nauwkeurigst?',options:['Een onverwachte val of botsing.','Een nieuw woord bedenken.','Een verhaal letterlijk geloven.','Bittere spot vanuit wantrouwen tegenover goede bedoelingen.'],correct:3,why:'Cynisme gaat vooral om de achterliggende wantrouwende houding.'},
{id:'x2',category:'Interpretatie',prompt:'Een verzonnen nieuwsbericht meldt: “Het stadsbestuur verbetert de luchtkwaliteit door alle meettoestellen uit te zetten.” Welke kritiek zit achter de grap?',options:['Problemen uit beeld halen wordt als oplossing verkocht.','Meettoestellen veroorzaken altijd vervuiling.','Iedereen moet minder ademhalen.','De schrijver geeft een serieus technisch advies.'],correct:0,why:'Het satirische bericht stelt het verbergen van een probleem voor als een oplossing.'},
{id:'x3',category:'Interpretatie',prompt:'Je staat voor een lift met “Buiten dienst”. Je vriend wijst naar het bord en zegt droog: “Dat gaat hier vlot vooruit.” Welk bewijs ondersteunt ironie?',options:['De zin bevat zes woorden.','Er wordt over beweging gesproken.','De positieve beoordeling botst met de stilstaande lift.','Een lift is altijd grappig.'],correct:2,why:'De spanning tussen de letterlijke woorden en de concrete situatie draagt de ironie.'},
{id:'x4',category:'Context',prompt:'Onder een screenshot staat alleen: “Wat slim van jou.” Welke conclusie is verantwoord?',options:['De spreker wil zeker kwetsen.','Je hebt meer informatie nodig over aanleiding, relatie en toon.','Het is altijd een oprecht compliment.','Het is zeker satire.'],correct:1,why:'De woorden alleen volstaan niet om de bedoelde toon betrouwbaar vast te stellen.'},
{id:'x5',category:'Context',prompt:'Een leerling maakt telkens dezelfde grap over het accent van een klasgenoot. Die vraagt te stoppen. Wat is het sterkste argument om de grap te heroverwegen?',options:['Herhaling maakt iedere grap beter.','Alleen de maker kan bepalen wat de grap betekent.','Een accent mag nooit in fictie voorkomen.','De uitgesproken grens en het herhaalde groepsbeeld wijzen op een mogelijk uitsluitende werking.'],correct:3,why:'Je houdt rekening met de concrete reactie, herhaling en sociale gevolgen, zonder alle humor over taal gelijk te stellen.'},
{id:'x6',category:'Context',prompt:'Een patiënt maakt een wrange grap over de eigen moeilijke behandeling. Een onbekende herhaalt de grap publiekelijk over die patiënt. Wat moet je opnieuw onderzoeken?',options:['De positie van de spreker, de relatie, het publiek en het mogelijke effect.','Alleen of de woorden exact gelijk zijn.','Alleen hoeveel mensen lachen.','Of de onbekende harder kan praten.'],correct:0,why:'Bij dezelfde woorden veranderen de betrokkenheid en de communicatieve situatie. Daardoor kan de interpretatie verschuiven.'},
{id:'x7',category:'Intentie & effect',prompt:'Een maker wil een vooroordeel bespotten. Een deel van het publiek leest de uiting als bevestiging ervan. Wat toont dit?',options:['De intentie heeft nooit betekenis.','Dat publiek heeft automatisch dezelfde bedoeling als de maker.','De intentie van de maker garandeert geen overeenkomstige interpretatie of uitwerking.','Satire is altijd onbegrijpelijk.'],correct:2,why:'Bedoeling en effect kunnen uiteenlopen. Daarom onderzoek je beide in hun context.'}
];
const GLOSSARY=[
['Slapstick','Fysieke humor met uitvergrote bewegingen, onhandigheid of botsingen.'],['Overdrijving','Iets groter, sterker of erger voorstellen dan het is. Ook: hyperbool.'],['Tegenstelling','Twee botsende eigenschappen of ideeën naast elkaar plaatsen.'],['Karikatuur','Herkenbare uiterlijke kenmerken of karaktertrekken sterk uitvergroten.'],['Woordspeling','Spelen met verschillende betekenissen of gelijkende klanken van woorden.'],['Neologisme','Een nieuw woord of een nieuwe betekenis van een bestaand woord.'],['Bewuste taalfout','Een afwijking van taalregels die met opzet wordt ingezet, bijvoorbeeld om te verrassen.'],['Denkfout','Een onjuiste stap in een redenering; kan bewust worden gebruikt voor een komisch effect.'],['Miscommunicatie','Een boodschap komt anders over dan bedoeld of wordt verkeerd begrepen.'],['Clou','De verrassende wending of afsluiting van een mop; ook pointe of punchline.'],['Vierde wand','De denkbeeldige grens tussen spelers en publiek. Die wordt doorbroken wanneer een personage zich bijvoorbeeld rechtstreeks tot de kijker richt.'],['Subjectief','Afhankelijk van persoonlijke ervaringen, opvattingen of voorkeuren.'],['Context','De omstandigheden die helpen om een uiting te begrijpen: wie, waar, wanneer, relatie, voorkennis en meer.'],['Spreker / zender','Degene die de uiting maakt of verspreidt.'],['Doelwit','De persoon, groep, gewoonte of toestand waarover de spot gaat.'],['Publiek / ontvanger','De mensen die de uiting horen, lezen of zien.'],['Intentie','Wat iemand met een boodschap probeert te bereiken.'],['Effect','Wat een boodschap bij ontvangers teweegbrengt; kan afwijken van de intentie.'],['Medium / kanaal','De manier waarop een boodschap wordt overgebracht, zoals een gesprek, video of groepschat.'],['Voorkennis','Wat je al weet en gebruikt om een nieuwe boodschap te begrijpen.'],['Taboe','Een onderwerp of handeling waarover in een bepaalde groep of situatie moeilijk openlijk wordt gesproken.'],['Stereotype','Een vereenvoudigd, veralgemeend beeld van een groep.'],['Stereotypering','Mensen of groepen voorstellen aan de hand van vaste, veralgemeende eigenschappen.'],['Vooroordeel','Een oordeel over iemand of een groep zonder voldoende kennis van de concrete persoon of situatie.'],['Machtsverhouding','Een verschil in invloed of positie tussen personen of groepen.'],['Naar beneden trappen','Spot richten op mensen met een zwakkere positie, waarbij hun achterstelling kan worden bevestigd. Onderzoek steeds de concrete verhouding.'],['Censuur','Het vooraf controleren, beperken of verbieden van publicatie of verspreiding van uitingen. Kritiek op een grap is op zichzelf niet hetzelfde als censuur.'],['Ethische grens','Een afweging over wat in een concrete situatie verantwoord of respectvol is.'],['Wettelijke grens','Een grens die door wetgeving wordt gesteld. De app doet geen juridische beoordeling van grappen.'],['Hypocrisie','Een verschil tussen de waarden die iemand uitdraagt en het eigen gedrag; ook schijnheiligheid.'],['Ambigu / meerduidig','Vatbaar voor meer dan één interpretatie.'],['Paradox','Een schijnbare tegenstelling die bij nader nadenken een inzicht kan opleveren.'],['Leedvermaak','Plezier om het ongeluk, de mislukking of de gêne van iemand anders.'],['Gêne','Schaamte of ongemak in een sociale situatie.'],['Register','Een manier van taalgebruik die past bij een situatie of publiek, bijvoorbeeld formeel of informeel.']
];
const OBJECTIVES=[
['LPD 1','Onderwerp, hoofdgedachte en hoofdpunten bepalen.','Leestests: centrale boodschap en kritiek achterhalen.','13'],

<script>const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').toLocaleLowerCase('nl-BE').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[.,!?;:]/g,'').trim().replace(/\s+/g,' ');
const words=s=>(String(s||'').trim().match(/\S+/g)||[]).length;
const KEY='humorlab.standalone.v1';
const fresh=()=>({version:1,warm:{},seen:[],match:Array(8).fill(''),matchChecked:false,gaps:Array(8).fill(''),gapsChecked:false,mc:{},notes:{},creative:{type:'dialoog',text:'',explanation:'',checks:{},done:false,skipped:false},exit:{answers:{},submitted:false,reflection:'',reviewed:false,confidence:'',attempts:[],student:''}});
let state=fresh(),storageOK=true;
try{const raw=localStorage.getItem(KEY);if(raw){const s=JSON.parse(raw);if(s.version===1&&Array.isArray(s.seen)&&Array.isArray(s.match)&&Array.isArray(s.gaps)&&s.mc&&s.notes&&s.warm&&s.creative&&s.exit&&Array.isArray(s.exit.attempts)&&s.exit.answers){state=s;state.match=Array.from({length:8},(_,i)=>s.match[i]||'');state.gaps=Array.from({length:8},(_,i)=>s.gaps[i]||'');state.creative.checks||={};}else storageOK=false;}}catch(_){storageOK=false;}
let route='start',studioTab='match',readingTab='bus',cardFilter='alle',activeVariants={},toastTimer;
const qmap=Object.fromEntries([...EVIDENCE,...READINGS.flatMap(x=>x.questions),...CONTEXTS.flatMap(x=>x.variants.map(v=>v.question)),...QUIZ].map(q=>[q.id,q]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;}catch(_){storageOK=false;}$('#save-label').textContent=storageOK?'Op dit apparaat bewaard':'Bewaren lukt niet';}
function toast(message){$('#toast').textContent=message;$('#toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),4200);}
function done(){return [WARM.every((_,i)=>state.warm[i]!==undefined),CARDS.every(c=>state.seen.includes(c.id)),state.matchChecked&&state.gapsChecked&&EVIDENCE.every(q=>state.mc[q.id]?.checked),READINGS.every(t=>t.questions.every(q=>state.mc[q.id]?.checked)),CONTEXTS.every(c=>c.variants.every(v=>state.mc[v.question.id]?.checked)&&words(state.notes[c.id])>=5),state.creative.done||state.creative.skipped,state.exit.submitted];}
function updateNav(){const d=done();$('#navigation').innerHTML=ROUTES.map((r,i)=>`<a href="#${r[0]}" class="${d[i]?'done':''}" ${route===r[0]?'aria-current="step"':''}><span class="num">${d[i]?'✓':String(i+1).padStart(2,'0')}</span><span>${r[1]}</span>${d[i]?'<span class="sr-only" hidden> afgerond</span>':''}</a>`).join('');$('#progress').value=d.filter(Boolean).length;$('#progress-label').textContent=`${d.filter(Boolean).length} / 7`;}
function label(n,t){return `<div class="eyebrow">${String(n).padStart(2,'0')} / ${t}</div>`;}
function next(id,text,note='Je kunt altijd terugkijken.'){return `<div class="nextbar"><p>${note}</p><a class="btn" href="#${id}">${text} <span aria-hidden="true">↗</span></a></div>`;}
function pageIntro(n,kicker,title,description){return `${label(n,kicker)}<h1>${title}</h1><p class="intro">${description}</p>`;}
function openModal(title,html){$('#modal-title').textContent=title;$('#modal-body').innerHTML=html;if(!$('#modal').open)$('#modal').showModal();$('#modal').scrollTop=0;}
function refresh(){const a=document.activeElement;let selector='';if(a?.id)selector='#'+CSS.escape(a.id);else if(a?.dataset.action){selector='[data-action="'+CSS.escape(a.dataset.action)+'"]';for(const k of ['id','value'])if(a.dataset[k]!==undefined)selector+='[data-'+k+'="'+CSS.escape(a.dataset[k])+'"]';}render(false);if(selector)$(selector)?.focus({preventScroll:true});}
function render(focus=false){const views={start:renderStart,kaarten:renderCards,studio:renderStudio,lezen:renderReading,context:renderContext,maken:renderCreate,exit:renderExit};$('#main').innerHTML=views[route]();updateNav();$('#save-label').textContent=storageOK?'Op dit apparaat bewaard':'Bewaren lukt niet';if(focus){window.scrollTo(0,0);$('#main').focus({preventScroll:true});}document.title=`${ROUTES.find(r=>r[0]===route)[1]} · HumorLab`;}
function go(){route=ROUTES.some(r=>r[0]===location.hash.slice(1))?location.hash.slice(1):'start';render(true);}
function renderStart(){return `<section class="hero"><div class="hero-copy"><div class="eyebrow">Een onderzoek naar de lach</div><h1>Snap de grap.<br><em>Lees de context.</em></h1><p>Eén zin. Twee situaties. Een heel ander effect.<br>Ontdek hoe humor werkt — en wat er achter een lach schuilgaat.</p><button class="btn yellow" data-action="start">Begin met een eerste indruk <span aria-hidden="true">↘</span></button></div><div class="hero-art"><svg viewBox="0 0 370 340" role="img" aria-label="Twee gezichten reageren verschillend op dezelfde woorden: mooi werk."><circle cx="205" cy="175" r="135" fill="#f1d46c"/><g transform="rotate(-8 130 90)"><rect x="30" y="35" width="235" height="88" rx="15" fill="#fffefb"/><path d="M78 120l-2 24 29-24" fill="#fffefb"/><text x="56" y="91" font-family="Georgia,serif" font-size="39" fill="#182f35">Mooi werk.</text></g><g transform="translate(90 156)"><rect width="91" height="102" rx="22" fill="#d9eae2" stroke="#182f35" stroke-width="3"/><path d="M23 34v11m45-11v11M24 65q22 26 44 0" fill="none" stroke="#182f35" stroke-width="5" stroke-linecap="round"/></g><g transform="translate(213 157) rotate(9 45 51)"><rect width="91" height="102" rx="22" fill="#ef957d" stroke="#182f35" stroke-width="3"/><path d="M22 35l14 3m20 0 14-3M24 73q21-18 44 0" fill="none" stroke="#182f35" stroke-width="5" stroke-linecap="round"/></g><path d="M310 53l15-16m-5 32 22-1M36 222l-18 8m26 6-4 19" stroke="#ef957d" stroke-width="4" stroke-linecap="round"/><g transform="rotate(-5 195 292)"><rect x="80" y="278" width="234" height="35" rx="4" fill="#ef957d"/><text x="100" y="301" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.5" fill="#182f35">CONTEXT VERANDERT ALLES.</text></g></svg></div></section>
<div class="hero-bottom"><span>7 haltes, op jouw tempo</span><span>Ongeveer 2 lesuren</span><span>Van herkennen naar begrijpen</span></div>
<div class="steps"><div class="step-card"><div class="step-icon" aria-hidden="true">Aa</div><h3>Herken het mechanisme</h3><p>Van woordspeling tot satire. Ontdek welke ingreep de grap laat werken.</p></div><div class="step-card"><div class="step-icon" aria-hidden="true">↔</div><h3>Verander van perspectief</h3><p>Wie spreekt? Wie luistert? Onderzoek waarom dezelfde zin anders kan landen.</p></div><div class="step-card"><div class="step-icon" aria-hidden="true">✓</div><h3>Onderbouw je lezing</h3><p>Zoek aanwijzingen. Leg uit wat je denkt en controleer het in het exit ticket.</p></div></div>
<div class="sectionhead" id="warmup"><h2>Eerst even: lach of frons?</h2><span class="tag">Jouw reactie telt · geen punten</span></div><p class="leadline">Kies je eerste reactie. Bekijk daarna welke informatie je nog nodig hebt.</p><div class="warmgrid">${WARM.map((w,i)=>`<article class="warmcard"><div><span class="label">Eerste indruk ${i+1}</span><blockquote>${esc(w.text)}</blockquote><p>${esc(w.context)}</p></div><div class="reactions" role="group" aria-label="Je reactie op situatie ${i+1}">${['Ik glimlach','Ik frons','Ik twijfel'].map((v,j)=>`<button class="reaction" data-action="warm" data-id="${i}" data-value="${j}" aria-pressed="${state.warm[i]===j}">${v}</button>`).join('')}</div>${state.warm[i]!==undefined?`<div class="reveal">${esc(w.reveal)}</div>`:''}</article>`).join('')}</div>
<div class="panel mint"><h3>Je hoeft een grap niet leuk te vinden om haar te begrijpen.</h3><p>Je smaak is persoonlijk. In dit lab oefen je vooral <strong>herkennen, verklaren en onderbouwen</strong>. Soms passen meerdere humorvormen. Soms ontbreekt informatie. Ook dat mag je vaststellen.</p></div>${next('kaarten','Ontdek de humorkaarten',`${Object.keys(state.warm).length} van 3 eerste indrukken ingevuld.`)}`;}
function renderCards(){const filters=[['alle','Alle vormen'],['mechanisme','Het mechanisme'],['toon','De toon'],['kritiek','Nabootsing & kritiek'],['grenzen','Zware thema’s']];return `${pageIntro(2,'Verkennen','Hoe werkt die grap?','Open de kaarten. Let op de herkenningssignalen en de overlap. Eén voorbeeld kan meerdere humorvormen combineren.')}<div class="tabs" role="group" aria-label="Filter humorkaarten">${filters.map(([id,t])=>`<button data-action="filter" data-id="${id}" aria-pressed="${cardFilter===id}">${t}</button>`).join('')}</div><p class="annotation">${CARDS.filter(c=>state.seen.includes(c.id)).length} van ${CARDS.length} kaarten bekeken · de groepen zijn kijkrichtingen, geen gesloten vakjes.</p><div class="conceptgrid">${CARDS.filter(c=>cardFilter==='alle'||c.group===cardFilter).map(c=>`<button class="concept" data-action="card" data-id="${c.id}"><span class="concept-number"><span>${String(CARDS.indexOf(c)+1).padStart(2,'0')}</span><span>${state.seen.includes(c.id)?'✓ bekeken':'↗'}</span></span><h3>${c.name}</h3><p>${esc(c.short)}</p><span class="concept-foot">Bekijk de grap <span aria-hidden="true">→</span></span></button>`).join('')}</div><div class="sectionhead"><h2>Dit onderscheid helpt.</h2></div><div class="compare"><div><h3>Ironie ↔ sarcasme ↔ cynisme</h3><p>Bij ironie onderzoek je de spanning tussen woorden en bedoeling. Bij sarcasme let je op bijtende spot. Bij cynisme vraag je welke wantrouwende houding achter de uitspraak zit. Context en toon blijven nodig.</p></div><div><h3>Parodie ↔ satire</h3><p>Parodie: <em>wat wordt nagebootst?</em><br>Satire: <em>wat wordt bekritiseerd?</em><br>Een nagebootste reclame die loze beloften bekritiseert, kan beide zijn.</p></div></div><div class="panel yellow"><h3>Een klein hulpmiddel</h3><p>Vraag telkens: <strong>waar zit de verrassing?</strong> In de gebeurtenis, het personage, de woorden, de toon of de boodschap? Zoek daarna naar een concrete aanwijzing.</p><button class="textlink" data-action="glossary">Open ook de woordenlijst met technieken en contextbegrippen →</button></div>${next('studio','Naar de oefenstudio')}`;}
function showCard(id){const c=CARDS.find(c=>c.id===id);if(!c)return;if(!state.seen.includes(id))state.seen.push(id);save();refresh();openModal(c.name,`<span class="pill">Humorkaart ${CARDS.indexOf(c)+1} / ${CARDS.length}</span><p style="margin-top:18px">${esc(c.definition)}</p><div class="concept-example">${esc(c.example)}</div><p><strong>Hier herken je het aan</strong><br>${esc(c.sign)}</p><div class="hintbox"><strong>Let op de nuance</strong><br>${esc(c.nuance)}</div><p style="margin-top:18px"><strong>Mogelijke functie</strong><br>${esc(c.effect)}</p><div class="actions"><button class="btn secondary" data-action="close-modal">Terug naar de kaarten</button><button class="btn" data-action="card" data-id="${CARDS[(CARDS.indexOf(c)+1)%CARDS.length].id}">Volgende kaart →</button></div>`);}
function feedback(ok,why,clue=''){return `<div class="feedback ${ok?'good':''}" role="status"><strong>${ok?'Goed onderbouwd.':'Bekijk je redenering nog eens.'}</strong>${esc(why)}${clue?`<span class="evidence">Aanwijzing: ${esc(clue)}</span>`:''}</div>`;}
function correctQ(q,s){return s?.choice===q.correct&&(!q.evidence||q.evidence.includes(s.evidence));}
function qHTML(q,{exit=false}={}){const s=exit?{choice:state.exit.answers[q.id],checked:state.exit.submitted}:(state.mc[q.id]||{});return `<article class="question" id="question-${q.id}"><fieldset><legend><span class="qnum">${exit?`${String(QUIZ.indexOf(q)+1).padStart(2,'0')} / 08 · ${esc(q.category)}`:'ONDERZOEK & KIES'}</span>${esc(q.prompt)}</legend>${q.scene?`<p class="situation">${esc(q.scene)}</p>`:''}<div class="choices">${q.options.map((o,i)=>`<label class="choice ${s.checked&&i===q.correct?'correct':''} ${s.checked&&i===s.choice&&i!==q.correct?'incorrect':''}"><input type="radio" name="${q.id}" data-q="${q.id}" ${exit?'data-exit="true"':''} value="${i}" ${s.choice===i?'checked':''} ${s.checked?'disabled':''}><span>${esc(o)}</span></label>`).join('')}</div>${q.evidence?`<label class="write-label" for="proof-${q.id}" style="margin-top:17px;font-size:12px">Welke alinea ondersteunt je antwoord het meest rechtstreeks?</label><select id="proof-${q.id}" data-proof="${q.id}" ${s.checked?'disabled':''}><option value="">Kies je tekstbewijs…</option>${['1','2','3','4','5','hele'].map(v=>`<option value="${v}" ${s.evidence===v?'selected':''}>${v==='hele'?'Het patroon in de hele tekst':'Alinea '+v}</option>`).join('')}</select>`:''}</fieldset>${s.checked?feedback(exit?s.choice===q.correct:correctQ(q,s),q.why,q.clue||''):''}${!exit?`<div class="actions"><button class="btn small ${s.checked?'secondary':''}" data-action="${s.checked?'retry-q':'check-q'}" data-id="${q.id}" ${!s.checked&&(s.choice===undefined||(q.evidence&&!s.evidence))?'disabled':''}>${s.checked?'Opnieuw proberen':'Controleer mijn antwoord'}</button>${q.evidence&&s.checked?`<span class="annotation">Keuze: ${s.choice===q.correct?'juist':'herbekijken'} · tekstbewijs: ${q.evidence.includes(s.evidence)?'passend':'herbekijken'}</span>`:''}</div>`:''}</article>`;}
function renderStudio(){let body='';if(studioTab==='match'){const opts=CARDS.slice(0,8).map(c=>c.id).sort((a,b)=>CARDS.find(c=>c.id===a).name.localeCompare(CARDS.find(c=>c.id===b).name,'nl'));body=`<div class="panel"><h2>Welke vorm staat centraal?</h2><p class="leadline">Koppel elk voorbeeld aan de meest specifieke vorm uit de lijst. Elk begrip past hier één keer. Kijk bij twijfel naar de context.</p>${MATCH.map(([s,a,why],i)=>`<div class="exercise-row"><span class="rownum">${i+1}</span><label for="match-${i}">${esc(s)}</label><select id="match-${i}" data-match="${i}"><option value="">Kies een humorvorm…</option>${opts.map(id=>`<option value="${id}" ${state.match[i]===id?'selected':''}>${CARDS.find(c=>c.id===id).name}</option>`).join('')}</select>${state.matchChecked?feedback(state.match[i]===a,`${CARDS.find(c=>c.id===a).name}. ${why}`):''}</div>`).join('')}<div class="actions"><button class="btn" data-action="check-match" ${state.match.some(v=>!v)?'disabled':''}>Controleer de koppelingen</button>${state.matchChecked?`<button class="btn secondary" data-action="retry-match">Herneem de fouten</button><span class="scoreline">${MATCH.filter((m,i)=>state.match[i]===m[1]).length} / 8 juist</span>`:''}</div></div>`;}
else if(studioTab==='gaps'){body=`<div class="panel"><h2>Geef de uitleg het juiste woord.</h2><p class="leadline">Vul de ontbrekende begrippen in. Hoofdletters en leestekens tellen niet mee. Je mag de woordenbank als steun gebruiken.</p><details><summary>Toon de woordenbank</summary><div class="wordbank">${['clou','intentie','karikatuur','subjectief','absurde humor','effect','neologisme','stereotypering'].map(w=>`<span>${w}</span>`).join('')}</div></details>${GAPS.map((g,i)=>`<div class="exercise-row"><span class="rownum">${i+1}</span><label for="gap-${i}">${esc(g.before)}<strong>[…]</strong>${esc(g.after)}</label><input type="text" id="gap-${i}" data-gap="${i}" value="${esc(state.gaps[i])}" autocomplete="off" spellcheck="false" placeholder="Vul het begrip in">${state.gapsChecked?feedback(g.accept.includes(norm(state.gaps[i])),`${g.answer}. ${g.why}`):''}</div>`).join('')}<div class="actions"><button class="btn" data-action="check-gaps" ${state.gaps.some(v=>!v.trim())?'disabled':''}>Controleer de begrippen</button>${state.gapsChecked?`<button class="btn secondary" data-action="retry-gaps">Herneem de fouten</button><span class="scoreline">${GAPS.filter((g,i)=>g.accept.includes(norm(state.gaps[i]))).length} / 8 juist</span>`:''}</div></div>`;}
else body=`<p class="leadline">Een begrip kiezen is één stap. Kun je ook aanwijzen <em>waarom</em> het past?</p>${EVIDENCE.map(q=>qHTML(q)).join('')}`;
return `${pageIntro(3,'Oefenen','Van idee naar inzicht.','Probeer de drie oefenvormen. Je krijgt telkens uitleg en kunt gericht hernemen. Een afgeronde oefening betekent dat je feedback hebt bekeken.')}<div class="tabs" role="group" aria-label="Oefenvorm">${[['match','01 · Matching',state.matchChecked],['gaps','02 · Gap fill',state.gapsChecked],['bewijs','03 · Zoek het bewijs',EVIDENCE.every(q=>state.mc[q.id]?.checked)]].map(([id,t,complete])=>`<button data-action="studio-tab" data-id="${id}" aria-pressed="${studioTab===id}">${t}${complete?' ✓':''}</button>`).join('')}</div>${body}${next('lezen','Lees tussen de regels','Alle drie de oefenvormen gedaan? Ga dan verder.')}`;}
function renderReading(){const t=READINGS.find(t=>t.id===readingTab);return `${pageIntro(4,'Lezen & interpreteren','Tussen de regels.','Lees de tekst zorgvuldig. Kies bij elke vraag een antwoord én de alinea die dat antwoord ondersteunt. Je kunt de tekst steeds opnieuw bekijken.')}<div class="tabs" role="group" aria-label="Kies de leestekst">${READINGS.map((t,i)=>`<button data-action="reading-tab" data-id="${t.id}" aria-pressed="${readingTab===t.id}">${i+1===1?'01 · De bus':'02 · Grenzen van humor'}${t.questions.every(q=>state.mc[q.id]?.checked)?' ✓':''}</button>`).join('')}</div><div class="reading-layout"><article class="reading" aria-label="Leestekst"><span class="eyebrow">${t.label}</span><h2>${esc(t.title)}</h2>${t.paragraphs.map((p,i)=>`<p><span class="para">${String(i+1).padStart(2,'0')}</span>${esc(p)}</p>`).join('')}<p class="attribution">${esc(t.source)}</p></article><div class="reading-questions">${t.questions.map(q=>qHTML(q)).join('')}</div></div>${next('context','Wissel de context','Beide teksten onderzocht? Test nu wat de omstandigheden veranderen.')}`;}
function renderContext(){return `${pageIntro(5,'Context & perspectief','Dezelfde zin. Ander effect.','Bekijk bij elke situatie beide contexten. Beantwoord de vragen en leg het verschil uit met concrete aanwijzingen. Je persoonlijke smaak hoeft niet te veranderen.')}<div class="compass" aria-label="Het contextkompas"><div><strong>01 · Wie?</strong><span>Spreker, doelwit en hun relatie.</span></div><div><strong>02 · Voor wie?</strong><span>Publiek, voorkennis en gevoeligheden.</span></div><div><strong>03 · Waar & hoe?</strong><span>Medium, toon, beelden en timing.</span></div><div><strong>04 · Waarom?</strong><span>Bedoeling en het mikpunt van de spot.</span></div><div><strong>05 · Wat doet het?</strong><span>Mogelijke effecten en ontbrekende informatie.</span></div></div>${CONTEXTS.map((c,i)=>{const v=activeVariants[c.id]||0;return `<article class="scenario" id="scenario-${c.id}"><div class="scenario-top"><span class="label">Situatie ${i+1} · ${c.title}</span><blockquote>${esc(c.quote)}</blockquote></div><div class="scenario-body"><div class="tabs" role="group" aria-label="Context van ${esc(c.title)}">${c.variants.map((x,j)=>`<button data-action="variant" data-id="${c.id}" data-value="${j}" aria-pressed="${v===j}">${x.name}${state.mc[x.question.id]?.checked?' ✓':''}</button>`).join('')}</div><div class="contextbox">${esc(c.variants[v].text)}</div>${qHTML(c.variants[v].question)}<label class="write-label" for="note-${c.id}">Vergelijk beide contexten. Welke twee gegevens veranderen jouw interpretatie?</label><textarea id="note-${c.id}" data-note="${c.id}" placeholder="In de eerste context… In de tweede context… Daardoor…">${esc(state.notes[c.id]||'')}</textarea><p class="annotation">Schrijf enkele zinnen. Je onderbouwing krijgt geen automatische punten.</p><details><summary>Vergelijk met een voorbeeldredenering</summary><div><p>${esc(c.model)}</p><p><strong>Controleer jezelf:</strong> noem je concrete gegevens uit beide contexten, verbind je die met een mogelijke interpretatie en laat je ruimte voor andere reacties?</p></div></details></div></article>`;}).join('')}<div class="panel mint"><label class="write-label" for="rephrase">Kleine transfer: formuleer na een mislukte presentatie een reactie die steun biedt én een verbeterpunt noemt.</label><textarea id="rephrase" data-note="rephrase" placeholder="Ik merkte dat… Volgende keer kun je…">${esc(state.notes.rephrase||'')}</textarea><details><summary>Bekijk een mogelijke formulering</summary><div>“Je voorbeelden waren duidelijk. Je sprak soms erg snel; laten we de volgende keer vooraf één keer oefenen.” Deze formulering benoemt concreet gedrag, biedt steun en maakt de ander niet belachelijk.</div></details></div>${next('maken','Zelf aan zet','Check: heb je in elke situatie beide contexten bekeken en vergeleken?')}`;}
const TASKS={dialoog:{name:'Een komische dialoog',text:'Schrijf een dialoog van 60–120 woorden waarin miscommunicatie een rol speelt. Maak duidelijk wie spreekt en in welke situatie. Gebruik minstens twee herkenbare humorvormen.'},nieuws:{name:'Een satirisch schoolbericht',text:'Schrijf een fictief nieuwsbericht van 60–120 woorden dat een schoolse gewoonte bekritiseert. Gebruik minstens twee humorvormen. Zet er duidelijk bij dat het satire is.'},tekst:{name:'Een miniatuur met humor',text:'Schrijf een korte scène van 60–120 woorden met minstens twee humorvormen. Geef je scène een herkenbare situatie en een passend publiek.'}};
function renderCreate(){const c=state.creative;return `${pageIntro(6,'Creatief toepassen · optioneel','Nu ben jij de maker.','Gebruik humor met een doel. Kies één opdracht en leg uit hoe jouw taalkeuzes bij je publiek passen. Je kunt deze uitbreiding ook overslaan.')}<div class="tabs" role="group" aria-label="Kies een schrijfopdracht">${Object.entries(TASKS).map(([id,t])=>`<button data-action="create-tab" data-id="${id}" aria-pressed="${c.type===id}">${t.name}</button>`).join('')}</div><div class="panel"><span class="pill">Creatieve uitbreiding · ongeveer 15 minuten</span><h2 style="margin-top:17px">${TASKS[c.type].name}</h2><p>${TASKS[c.type].text}</p><label class="write-label" for="creative-text">Jouw tekst</label><textarea id="creative-text" data-creative="text" style="min-height:250px" placeholder="Geef je tekst een titel en laat de grap werken…">${esc(c.text)}</textarea><div class="counter" id="wordcount">${words(c.text)} woorden · richtlengte 60–120</div><label class="write-label" for="creative-explanation">Licht je keuzes toe</label><textarea id="creative-explanation" data-creative="explanation" placeholder="Mijn publiek is… Mijn doel is… Ik gebruik …, dat zie je aan… Een mogelijk effect is…">${esc(c.explanation)}</textarea><div class="self-check"><h3>Lees je werk nog één keer na.</h3><ul class="checklist">${['Mijn publiek, situatie en bedoeling zijn duidelijk.','Ik kan twee humorvormen aanwijzen en uitleggen hoe ze werken.','Ik heb nagedacht over het doelwit en het mogelijke effect.','Mijn tekst is samenhangend en ik heb taal en spelling nagekeken.'].map((s,i)=>`<li><label><input type="checkbox" data-creative-check="${i}" ${c.checks[i]?'checked':''}>${s}</label></li>`).join('')}</ul></div><div class="actions"><button class="btn" data-action="finish-create">Bewaar als afgerond</button><button class="btn secondary" data-action="skip-create">Sla deze uitbreiding over</button>${c.done?'<span class="pill">✓ Opdracht afgerond</span>':c.skipped?'<span class="pill">Uitbreiding overgeslagen</span>':''}</div><p class="annotation" style="margin-top:14px">Je tekst wordt lokaal bewaard. De app beoordeelt de kwaliteit niet automatisch; gebruik de checklist of bespreek je tekst met je leerkracht.</p></div><details><summary>Extra: bespreek een humorfragment met een klasgenoot</summary><div><p>Kies samen een literair humorfragment, bijvoorbeeld een cabarettekst of kort verhaal uit de les. Leg uit wat je ervaart, welke aanwijzingen je interpretatie ondersteunen en wat het fragment zegt over jullie leefwereld.</p><p>Reageer op elkaar: waar verschillen jullie lezingen, en welke tekstgegevens maken die verschillen begrijpelijk? Hiermee oefen je echte interactie en literatuurbeleving.</p></div></details>${next('exit','Naar het exit ticket','Klaar om de kern op eigen kracht te controleren?')}`;}
function quizScore(){return QUIZ.filter(q=>state.exit.answers[q.id]===q.correct).length;}
function categoryScores(){return ['Begrippen','Interpretatie','Context','Intentie & effect'].map(cat=>{const qs=QUIZ.filter(q=>q.category===cat);return {cat,score:qs.filter(q=>state.exit.answers[q.id]===q.correct).length,max:qs.length};});}
function exitRecommendations(){const links={'Begrippen':['kaarten','Herbekijk de humorkaarten'],'Interpretatie':['lezen','Oefen opnieuw met tekstbewijs'],'Context':['context','Gebruik het contextkompas'],'Intentie & effect':['context','Vergelijk bedoeling en effect']};return categoryScores().filter(s=>s.score<s.max).map(s=>`<li><a href="#${links[s.cat][0]}" data-action="close-modal-if">${links[s.cat][1]}</a> — ${s.cat.toLowerCase()}: ${s.score}/${s.max}.</li>`).join('');}
function renderExit(){const x=state.exit;let result='';if(x.submitted){const score=quizScore();result=`<div class="panel mint" id="exit-result" tabindex="-1"><div class="exit-banner"><div class="bigscore" aria-label="${score} van 8 juist">${score}<small>/ 8</small></div><div><span class="eyebrow">Poging ${x.attempts.length} · terugblik</span><h2>${score===8?'Je legt de verbanden.':score>=6?'Een stevige basis.':'Er valt nog iets te ontdekken.'}</h2><p>${score===8?'Je gesloten antwoorden zijn allemaal juist. Bekijk ook je eigen onderbouwing: de nuance zit in je uitleg.':'Bekijk per vraag de uitleg. Gebruik daarna de gerichte oefentips en probeer het gerust opnieuw.'}</p></div></div></div><div class="summarycards">${categoryScores().map(s=>`<div class="summarycard"><strong>${s.score}<small> / ${s.max}</small></strong><span>${s.cat}</span></div>`).join('')}</div><div class="panel"><h3>Jouw volgende stap</h3>${exitRecommendations()?`<ul>${exitRecommendations()}</ul>`:'<p>Pas het contextkompas toe op een nieuwe grap die je zelf tegenkomt. Welke informatie heb je nodig om haar te begrijpen?</p>'}${x.attempts.length>1?`<p class="annotation">Eerste poging: ${x.attempts[0].score}/8. Huidige poging: ${score}/8.</p>`:''}</div>`;}
return `${pageIntro(7,'Zelfstandig controleren','Snap jij de kern?','Acht nieuwe vragen en één korte onderbouwing. Beantwoord ze eerst zelfstandig. Je krijgt de antwoorden en uitleg samen na het indienen.')}<div class="notice">De acht gesloten vragen tellen elk voor één punt. Je eigen onderbouwing krijgt een voorbeeld en controlepunten, geen automatische score.</div>${result}<div id="quiz-questions">${QUIZ.map(q=>qHTML(q,{exit:true})).join('')}</div><div class="panel"><span class="label">09 · Jouw onderbouwing</span><h2 style="margin-top:12px">Meer dan een goed bedoeld grapje</h2><p>Een teamgenoot maakt na een fout een grap over zichzelf. Later zet iemand anders dezelfde woorden bij een video van die fout in een grote groepschat.</p><label class="write-label" for="exit-reflection">Leg met minstens twee contextgegevens uit waarom de grap anders kan overkomen dan bedoeld.</label><textarea id="exit-reflection" data-exit-note="reflection" ${x.submitted?'readonly':''} placeholder="De spreker… Het publiek… Daardoor…">${esc(x.reflection)}</textarea>${x.submitted?`<div class="feedback good"><strong>Vergelijk je redenering.</strong>De eerste spreker maakt een grap over de eigen fout en kan daarmee zichzelf relativeren. In de groepschat wordt iemand anders het doelwit, bereikt de video een groter publiek en ontbreekt mogelijk de oorspronkelijke toon. Daardoor kan de herhaling als uitlachen overkomen, ook als de verspreider amusement bedoelde.<ul><li>Noem ik minstens twee concrete veranderingen?</li><li>Verbind ik die met een mogelijk ander effect?</li><li>Maak ik onderscheid tussen bedoeling en interpretatie?</li></ul></div><label class="checklist"><span><input type="checkbox" data-exit-review ${x.reviewed?'checked':''}> Ik heb mijn onderbouwing met de controlepunten vergeleken.</span></label>`:''}</div>${!x.submitted?`<div class="actions"><button class="btn" data-action="submit-exit">Dien mijn exit ticket in →</button><span class="annotation" id="exit-count">${Object.keys(x.answers).length} / 8 vragen beantwoord</span></div>`:`<div class="panel yellow"><h3>Hoe zeker voel je je nu?</h3><div class="reactions" role="group" aria-label="Zelfinschatting">${['Ik kan dit uitleggen','Ik twijfel nog soms','Ik wil extra oefenen'].map((t,i)=>`<button class="reaction" data-action="confidence" data-value="${i}" aria-pressed="${x.confidence===String(i)}">${t}</button>`).join('')}</div><label class="write-label" for="student" style="margin-top:20px">Naam en klas voor je resultaatblad <span class="annotation">(optioneel, alleen lokaal)</span></label><input id="student" type="text" data-exit-note="student" value="${esc(x.student)}" placeholder="Naam · klas"><div class="actions"><button class="btn" data-action="print">Druk resultaatblad af / bewaar als pdf</button><button class="btn secondary" data-action="download">Download mijn antwoorden</button><button class="btn secondary" data-action="retry-exit">Nieuwe poging</button></div><p class="annotation" style="margin-top:13px">Resultaten worden niet automatisch naar je leerkracht verstuurd. Deel je resultaatblad of antwoordenbestand zelf.</p></div>`}`;}
function showGlossary(){openModal('Begrippen binnen handbereik',`<label class="write-label" for="glossary-search">Zoek een humorvorm, techniek of contextbegrip</label><input type="text" id="glossary-search" placeholder="Bijvoorbeeld: ironie, clou, intentie…" autocomplete="off"><dl class="glossary-list" id="glossary-results"></dl>`);fillGlossary('');$('#glossary-search').focus();}
function fillGlossary(search){const list=[...CARDS.map(c=>[c.name,c.definition]),...GLOSSARY].sort((a,b)=>a[0].localeCompare(b[0],'nl'));const filtered=list.filter(([a,b])=>norm(a+' '+b).includes(norm(search)));$('#glossary-results').innerHTML=filtered.length?filtered.map(([a,b])=>`<dt>${esc(a)}</dt><dd>${esc(b)}</dd>`).join(''):'<p class="empty">Geen begrip gevonden. Probeer een kortere zoekterm.</p>';}
function showTeacher(){openModal('Voor de leerkracht',`<span class="pill">Nederlands · derde graad dubbele finaliteit</span><p style="margin-top:17px"><strong>HumorLab</strong> sluit aan bij III-Ned-da, D/2024/13.758/276, versie juni 2024 (Katholiek Onderwijs Vlaanderen). Het basisleerplan is bedoeld voor de derde graad D/A, met uitzondering van de richtingen waarvoor III-NedS-da geldt.</p><p><strong>Kern:</strong> herkennen → verklaren → contextueel interpreteren. LPD 11 en 12 noemen humor expliciet in hun wenken. LPD 10 maakt de sociale werking zichtbaar.</p><div class="tablewrap"><table><thead><tr><th>Doel</th><th>Beknopte omschrijving</th><th>In HumorLab</th><th>p.</th></tr></thead><tbody>${OBJECTIVES.map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><h3 style="margin-top:24px">Aanvullende doelen</h3><ul><li><strong>LPD 4 en 5 (p. 15):</strong> doelgericht schrijven en creatief omgaan met taal bij “Zelf aan zet”.</li><li><strong>LPD 8 (p. 17):</strong> beleving en interpretatie bij een literair humorfragment in de extra bespreekopdracht. Het herkennen van humor in een informatieve tekst volstaat hiervoor niet.</li><li><strong>LPD 6 (p. 16) en LPD 9 (p. 17):</strong> alleen bij echte interactie met anderen, met voor LPD 9 aandacht voor de relevantie van literatuur. De digitale klikinteractie realiseert die doelen niet op zichzelf.</li></ul><h3>Gebruik in de les</h3><p>Reken op ongeveer twee lesuren voor de kernroute, afhankelijk van lees- en werktempo. De creatieve opdracht is een uitbreiding van ongeveer 15 minuten. Leerlingen kunnen zelfstandig navigeren; de route is niet vergrendeld.</p><p>Het tekstniveau bevat figuurlijk taalgebruik, abstracte begrippen en langere zinnen. Woordenbank, woordenlijst, tekstbewijs en contextkompas ondersteunen differentiatie. De bustekst bevat originele geselecteerde passages; de tekst over grenzen is een transparant vermelde didactische bewerking.</p><h3>Evaluatie</h3><p>Routevinkjes tonen <strong>doorlopen activiteiten</strong>, geen bewijs van beheersing. Het exit ticket toont acht gesloten scores per inhoudsdomein. Open onderbouwingen, creativiteit en argumentatie vragen zelfreflectie of feedback van de leerkracht. Deze module oefent onderdelen van de doelen; ze dekt niet het volledige leerplan.</p><p>Bij open werk: kijk naar begrip, concrete aanwijzingen, verband tussen context en effect, kwaliteit van de argumentatie en verzorgd taalgebruik. Bij creatief werk ook naar doelgerichtheid, herkenbare humor en originaliteit, aansluitend bij de rubrics op p. 18–20 van de humorbundel.</p><h3>Bewaren en delen</h3><p>Alles werkt in dit ene bestand zonder internet. Voortgang blijft in deze browser op dit apparaat, voor zover lokaal opslaan is toegestaan. Er is geen centrale resultatenlijst. Het resultaatblad en de tekstexport bevatten ook de open antwoorden. Op een gedeeld toestel kan de volgende gebruiker de bewaarde antwoorden zien: wis de voortgang voor een nieuwe leerling.</p><button class="btn secondary" data-action="sources">Bekijk bronnen & didactische keuzes</button>`);}
function showSources(){openModal('Bronnen & didactische keuzes',`<h3>Lesmateriaal</h3><ul><li><strong>Hoofdstuk 7 – Humor – Antwoorden leerkrachtenbundel</strong>, aangeleverd door de leerkracht, 20 pagina’s. Begrippen en voorbeelden: p. 7–16; context en grenzen: p. 5–6; opdrachten en rubrics: p. 17–20.</li><li><strong>III-Ned-da</strong>, Nederlands, derde graad D/A-finaliteit. Katholiek Onderwijs Vlaanderen, D/2024/13.758/276, versie juni 2024. Doelen p. 13–22; tekstkenmerken p. 25–29.</li></ul><h3>Teksten in de app</h3><p>De bustekst bestaat uit vijf geselecteerde passages uit Roger Schoemans’ tekst in De Standaard, zoals opgenomen in de bundel (p. 9). De tekst “Mogen we met niets meer lachen?” is een didactische bewerking van de bundeltekst (p. 5–6), daar toegeschreven aan Schamper, Daan Van Cauwenberge & Jakob Smet, met inzichten van Anke Lion.</p><p>Alle overige korte scenario’s en oefenvoorbeelden zijn voor deze app geformuleerd. De illustratie is oorspronkelijk. De video’s, liedtekst en cartoons uit de bundel zijn niet nodig om de route te volgen.</p><h3>Inhoudelijke verfijning</h3><p>Humorvormen kunnen overlappen. Een parodie kan satire zijn; een ironische uiting kan bijtend worden. Cynisme verwijst naar een houding. Galgenhumor krijgt hier als onderscheidende focus de eigen benarde situatie. Goede intenties garanderen geen overeenkomstig effect.</p><ul><li><a href="https://taaladvies.net/ironie-of-sarcasme-of-cynisme/" target="_blank" rel="noopener noreferrer">Taaladvies.net — Ironie, sarcasme en cynisme</a></li><li><a href="https://www.vlaanderen.be/team-taaladvies/taaladviezen/sarcasme-taalkundige-term" target="_blank" rel="noopener noreferrer">Team Taaladvies — Sarcasme en de rol van context</a></li><li><a href="https://www.dbnl.org/tekst/dela012alge01_01/dela012alge01_01_03108.php" target="_blank" rel="noopener noreferrer">Algemeen letterkundig lexicon — Parodie</a></li><li><a href="https://www.dbnl.org/tekst/dela012alge01_01/dela012alge01_01_03005.php" target="_blank" rel="noopener noreferrer">Algemeen letterkundig lexicon — Satire</a></li><li><a href="https://wortschaetze.uni-graz.at/de/wortschaetze/wortschaetze-nach-themen/belegdatenbank-recht/g/galgenhumor/" target="_blank" rel="noopener noreferrer">Universiteit Graz — Galgenhumor</a></li></ul><p class="annotation">Alle leerinhoud is ingebouwd. Alleen deze aanvullende bronlinks vereisen internet. De app is een leermiddel en maakt geen juridische beoordeling van afzonderlijke grappen.</p>`);}
function showSettings(){openModal('Jouw voortgang',`<p><strong>${storageOK?'Je antwoorden worden bewaard in deze browser op dit apparaat.':'Deze browser kan je antwoorden momenteel niet bewaren.'}</strong> Een ander toestel of een andere browser heeft een eigen voortgang. Een verplaatst bestand kan ook een nieuwe opslagplek krijgen.</p><p>Gebruik de tekstexport om je antwoorden zelf te bewaren. Er worden geen gegevens naar een server verstuurd. Op een gedeeld toestel kan een volgende gebruiker je bewaarde werk zien.</p><div class="actions"><button class="btn" data-action="download">Download mijn antwoorden</button><button class="btn secondary" data-action="confirm-reset">Wis mijn voortgang</button></div>`);}
function reportText(){const x=state.exit;const ls=['HUMORLAB — MIJN ANTWOORDEN',x.student?`Naam / klas: ${x.student}`:'',`Datum: ${new Date().toLocaleString('nl-BE')}`,`Route: ${done().filter(Boolean).length}/7 onderdelen afgerond`,'',`EXIT TICKET: ${x.submitted?quizScore()+'/8 (poging '+x.attempts.length+')':'nog niet ingediend'}`];if(x.submitted){categoryScores().forEach(s=>ls.push(`${s.cat}: ${s.score}/${s.max}`));QUIZ.forEach((q,i)=>ls.push('',`${i+1}. ${q.prompt}`,`Mijn antwoord: ${q.options[x.answers[q.id]]||'—'}`,`Correct antwoord: ${q.options[q.correct]}`,q.why));}ls.push('','MIJN ONDERBOUWING',x.reflection||'Nog niet ingevuld.',`Zelfcontrole: ${x.reviewed?'nagekeken':'nog niet nagekeken'}`,`Zelfinschatting: ${['Ik kan dit uitleggen','Ik twijfel nog soms','Ik wil extra oefenen'][Number(x.confidence)]&&x.confidence!==''?['Ik kan dit uitleggen','Ik twijfel nog soms','Ik wil extra oefenen'][Number(x.confidence)]:'nog niet ingevuld'}`,'','CONTEXTREFLECTIES');CONTEXTS.forEach(c=>ls.push('',c.title,state.notes[c.id]||'Nog niet ingevuld.'));ls.push('','STEUNENDE HERFORMULERING',state.notes.rephrase||'Nog niet ingevuld.','','CREATIEVE OPDRACHT',TASKS[state.creative.type].name,state.creative.text||'Nog niet ingevuld.','','TOELICHTING BIJ MIJN TEKST',state.creative.explanation||'Nog niet ingevuld.','','Open antwoorden zijn niet automatisch beoordeeld.');return ls.filter(x=>x!==undefined).join('\n');}
function download(){openModal('Bewaar je antwoorden',`<p>Je kunt je antwoorden als tekstbestand bewaren of de tekst hieronder selecteren en kopiëren. Zo kun je je werk ook delen wanneer je browser downloads beperkt.</p><label class="write-label" for="export-text">Jouw antwoorden</label><textarea id="export-text" readonly style="min-height:300px">${esc(reportText())}</textarea><div class="actions"><button class="btn" data-action="download-file">Download tekstbestand</button><button class="btn secondary" data-action="select-export">Selecteer alle tekst</button></div>`);}
function downloadFile(){const a=document.createElement('a');a.href='data:text/plain;charset=utf-8,'+encodeURIComponent('\uFEFF'+reportText());a.download='HumorLab-mijn-antwoorden.txt';document.body.appendChild(a);a.click();a.remove();}
function printReport(){const x=state.exit;$('#print-report').innerHTML=`<h1>HumorLab · resultaatblad</h1><p>${esc(x.student||'Naam / klas: __________________________')}</p><p class="muted">${esc(new Date().toLocaleString('nl-BE'))} · Poging ${x.attempts.length}</p><h2>Exit ticket: ${quizScore()} / 8</h2><p>${categoryScores().map(s=>`${esc(s.cat)}: ${s.score}/${s.max}`).join(' · ')}</p>${QUIZ.map((q,i)=>`<section><h3>${i+1}. ${esc(q.prompt)}</h3><p>Mijn antwoord: ${esc(q.options[x.answers[q.id]])} — <strong>${x.answers[q.id]===q.correct?'juist':'herbekijken'}</strong></p><p class="muted">${esc(q.why)}</p></section>`).join('')}<h2>Mijn onderbouwing</h2><p style="white-space:pre-wrap">${esc(x.reflection)}</p><p>Zelfcontrole: ${x.reviewed?'nagekeken':'nog niet nagekeken'}.</p><p>Zelfinschatting: ${esc(x.confidence!==''?['Ik kan dit uitleggen','Ik twijfel nog soms','Ik wil extra oefenen'][Number(x.confidence)]:'nog niet ingevuld')}.</p><h2>Contextreflecties</h2>${CONTEXTS.map(c=>`<section><h3>${esc(c.title)}</h3><p style="white-space:pre-wrap">${esc(state.notes[c.id]||'Nog niet ingevuld.')}</p></section>`).join('')}<h2>Steunende herformulering</h2><p style="white-space:pre-wrap">${esc(state.notes.rephrase||'Nog niet ingevuld.')}</p><h2>Creatieve opdracht</h2><p style="white-space:pre-wrap">${esc(state.creative.text||'Nog niet ingevuld.')}</p><h3>Toelichting</h3><p style="white-space:pre-wrap">${esc(state.creative.explanation||'Nog niet ingevuld.')}</p><p class="muted">Open antwoorden zijn niet automatisch beoordeeld. Leerplankoppeling: III-Ned-da, D/2024/13.758/276, juni 2024.</p>`;window.print();}
function replaceQuestion(id){const el=$('#question-'+id);if(el){const top=el.getBoundingClientRect().top;el.outerHTML=qHTML(qmap[id]);const newEl=$('#question-'+id);window.scrollBy(0,newEl.getBoundingClientRect().top-top);newEl.querySelector('.btn')?.focus({preventScroll:true});}}
document.addEventListener('click',event=>{const b=event.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id,v=b.dataset.value;
if(a==='start'){$('#warmup').scrollIntoView({behavior:'smooth'});$('#warmup').nextElementSibling.nextElementSibling.querySelector('button')?.focus({preventScroll:true});}
else if(a==='warm'){state.warm[id]=Number(v);save();refresh();}
else if(a==='filter'){cardFilter=id;refresh();}
else if(a==='card')showCard(id);
else if(a==='close-modal'||a==='close-modal-if')$('#modal').close();
else if(a==='glossary')showGlossary();
else if(a==='teacher')showTeacher();
else if(a==='sources')showSources();
else if(a==='settings')showSettings();
else if(a==='studio-tab'){studioTab=id;refresh();}
else if(a==='reading-tab'){readingTab=id;refresh();}
else if(a==='check-match'){if(state.match.every(Boolean)){state.matchChecked=true;save();refresh();toast(`${MATCH.filter((m,i)=>state.match[i]===m[1]).length} van 8 juist. Bekijk de uitleg bij de voorbeelden.`);}}
else if(a==='retry-match'){state.match=state.match.map((val,i)=>val===MATCH[i][1]?val:'');state.matchChecked=false;save();refresh();}
else if(a==='check-gaps'){if(state.gaps.every(x=>x.trim())){state.gapsChecked=true;save();refresh();toast(`${GAPS.filter((g,i)=>g.accept.includes(norm(state.gaps[i]))).length} van 8 juist. Bekijk de uitleg.`);}}
else if(a==='retry-gaps'){state.gaps=state.gaps.map((val,i)=>GAPS[i].accept.includes(norm(val))?val:'');state.gapsChecked=false;save();refresh();}
else if(a==='check-q'){const s=state.mc[id],q=qmap[id];if(s&&s.choice!==undefined&&(!q.evidence||s.evidence)){s.checked=true;save();replaceQuestion(id);updateNav();}}
else if(a==='retry-q'){state.mc[id]={};save();replaceQuestion(id);updateNav();}
else if(a==='variant'){activeVariants[id]=Number(v);const old=$('#scenario-'+id).getBoundingClientRect().top;refresh();window.scrollBy(0,$('#scenario-'+id).getBoundingClientRect().top-old);}
else if(a==='create-tab'){state.creative.type=id;state.creative.done=false;state.creative.skipped=false;save();refresh();}
else if(a==='finish-create'){const c=state.creative;if(!c.text.trim()||!c.explanation.trim()){toast('Vul je tekst én de toelichting bij je keuzes in.');return;}if(![0,1,2,3].every(i=>c.checks[i])){toast('Lees je werk na en vul de vier controlepunten in.');return;}c.done=true;c.skipped=false;save();refresh();toast('Je werk is als afgerond bewaard.');}
else if(a==='skip-create'){state.creative.skipped=true;state.creative.done=false;save();location.hash='exit';}
else if(a==='submit-exit'){if(state.exit.submitted)return;const missing=QUIZ.find(q=>state.exit.answers[q.id]===undefined);if(missing){toast('Beantwoord eerst alle acht vragen.');$('#question-'+missing.id).scrollIntoView({behavior:'smooth',block:'center'});$('#question-'+missing.id+' input').focus({preventScroll:true});return;}if(words(state.exit.reflection)<5){toast('Voeg nog een korte onderbouwing toe bij vraag 9.');$('#exit-reflection').focus();return;}state.exit.submitted=true;state.exit.reviewed=false;state.exit.attempts.push({score:quizScore(),answers:{...state.exit.answers},reflection:state.exit.reflection,date:new Date().toISOString()});save();refresh();$('#exit-result').scrollIntoView({behavior:'smooth',block:'start'});$('#exit-result').focus({preventScroll:true});}
else if(a==='confidence'){state.exit.confidence=v;save();refresh();}
else if(a==='retry-exit'){openModal('Een nieuwe poging',`<p>Je vorige score blijft bewaard als eerdere poging. De acht keuzes worden leeggemaakt. Je onderbouwing blijft staan zodat je die kunt herwerken.</p><div class="actions"><button class="btn" data-action="confirm-retry-exit">Begin opnieuw</button><button class="btn secondary" data-action="close-modal">Terug</button></div>`);}
else if(a==='confirm-retry-exit'){state.exit.submitted=false;state.exit.answers={};state.exit.reviewed=false;state.exit.confidence='';save();$('#modal').close();refresh();$('#main').focus();window.scrollTo(0,0);}
else if(a==='download')download();
else if(a==='download-file')downloadFile();
else if(a==='select-export'){$('#export-text').focus();$('#export-text').select();}
else if(a==='print')printReport();
else if(a==='confirm-reset')openModal('Alle voortgang wissen?',`<p>Dit wist alle antwoorden, open teksten en exit-ticketpogingen van HumorLab in deze browser. Download eerst je antwoorden als je die wilt bewaren.</p><div class="actions"><button class="btn" data-action="reset">Ja, wis mijn voortgang</button><button class="btn secondary" data-action="close-modal">Annuleren</button></div>`);
else if(a==='reset'){state=fresh();save();$('#modal').close();cardFilter='alle';studioTab='match';readingTab='bus';activeVariants={};if(location.hash==='#start')go();else location.hash='start';toast('Je begint met een lege leerroute.');}
});
document.addEventListener('change',event=>{const t=event.target;
if(t.dataset.q){const id=t.dataset.q;if(t.dataset.exit){if(!state.exit.submitted){state.exit.answers[id]=Number(t.value);save();if($('#exit-count'))$('#exit-count').textContent=`${Object.keys(state.exit.answers).length} / 8 vragen beantwoord`;}}else{state.mc[id]||={};state.mc[id].choice=Number(t.value);save();enableQ(id);}}
if(t.dataset.proof){const id=t.dataset.proof;state.mc[id]||={};state.mc[id].evidence=t.value;save();enableQ(id);}
if(t.dataset.match!==undefined){state.match[Number(t.dataset.match)]=t.value;state.matchChecked=false;save();refresh();$('#match-'+t.dataset.match)?.focus({preventScroll:true});}
if(t.dataset.creativeCheck!==undefined){state.creative.checks[t.dataset.creativeCheck]=t.checked;state.creative.done=false;save();updateNav();}
if(t.hasAttribute('data-exit-review')){state.exit.reviewed=t.checked;save();}
});
function enableQ(id){const q=qmap[id],s=state.mc[id],btn=$(`#question-${id} [data-action="check-q"]`);if(btn)btn.disabled=s.choice===undefined||(!!q.evidence&&!s.evidence);}
document.addEventListener('input',event=>{const t=event.target;
if(t.id==='glossary-search'){fillGlossary(t.value);return;}
if(t.dataset.gap!==undefined){state.gaps[Number(t.dataset.gap)]=t.value;state.gapsChecked=false;save();const btn=$('[data-action="check-gaps"]');if(btn)btn.disabled=state.gaps.some(v=>!v.trim());$('#main').querySelectorAll('.exercise-row .feedback').forEach(n=>n.remove());$('.scoreline')?.remove();$('[data-action="retry-gaps"]')?.remove();updateNav();}
if(t.dataset.note){state.notes[t.dataset.note]=t.value;save();updateNav();}
if(t.dataset.creative){state.creative[t.dataset.creative]=t.value;state.creative.done=false;state.creative.skipped=false;save();if($('#wordcount'))$('#wordcount').textContent=`${words(state.creative.text)} woorden · richtlengte 60–120`;updateNav();}
if(t.dataset.exitNote){if(t.dataset.exitNote==='reflection'&&state.exit.submitted)return;state.exit[t.dataset.exitNote]=t.value;save();}
});
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal')){const r=$('#modal').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('#modal').close();}});
window.addEventListener('hashchange',go);
go();
if(!storageOK)toast('Lokaal bewaren was niet beschikbaar. Download je antwoorden voor je afsluit.');
</script>
</body>
</html>
